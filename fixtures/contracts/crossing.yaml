# A synthetic domain contract that names another contract's declarations. Owned
# by neither implementation: both parsers read it, and both compiles must
# resolve `testing/entity`, `testing/cohort` and `testing/affects` when
# `testing` is compiled beside it and refuse when it is not.
contract: crossing
version: 1
lineage: genesis

sorts:
  local-entity:
    binding: { kind: release, namespace: EX, release: "2026-01-01" }
    identifier_class: { prefix: EX, pattern: 'EX:[a-z0-9\-]+' }

dimensions:
  # A dimension declared here applying to an operator declared there, with a
  # restriction sort declared there too.
  scope:
    restriction_sort: testing/cohort
    placement: claim
    applies_to: [testing/affects]

instantiations:
  # A cross-contract admission: `testing`'s template, filled with one sort of
  # each contract.
  affects-local-entity:
    template: testing/affects
    roles: { cause: [testing/entity], effect: [local-entity] }

# The four fields of `testing`'s `instantiation:affects-entity-outcome`, exactly:
# a declaration whose fields match an estimand while its instantiation does not
# admit the claim.
estimands:
  instantiation:affects-local-entity:
    forms: [contrast, quantity, law-parameters, event-locked, association, enrichment]
    conditioning_sorts: [testing/entity]
