# python/tests/fixtures/biology-fixture.yaml
# A TEST FIXTURE in the `biology` namespace, not a domain. The relocation and
# world tests pin a `biology` contract identity and need two distinct ones for
# their pin-disagreement arms; `profiles.py` parses this document twice with
# different descriptions. No biology pack ships under base v2; this stays a
# fixture and binds no real vocabulary.
contract: biology
version: 1
lineage: genesis
description: fixture
sorts:
  gene:
    binding: { kind: release, namespace: EX, release: "2026-01-01" }
    identifier_class: { prefix: EX, pattern: 'EX:.+' }
  level:
    binding: { kind: release, namespace: EX, release: "2026-01-01" }
    identifier_class: { prefix: EX, pattern: 'EX:.+' }
  measure:
    binding: { kind: release, namespace: EX, release: "2026-01-01" }
    identifier_class: { prefix: EX, pattern: 'EX:.+' }
  identification:
    binding: { kind: release, namespace: EX, release: "2026-01-01" }
    identifier_class: { prefix: EX, pattern: 'EX:.+' }
dimensions: {}
templates:
  affects:
    roles:
      cause: { arity: one }
      effect: { arity: one }
    sign_apt: true
    layers: [causal]
    forms: [polar, "null"]
    edge: { cause: cause, effect: effect }
instantiations:
  affects-gene-gene:
    template: affects
    roles: { cause: [gene], effect: [gene] }
estimands:
  instantiation:affects-gene-gene:
    forms: [contrast, quantity]
    conditioning_sorts: [gene]
facets:
  gene-axis:
    attaches_to: [dataset]
    fields:
      axis: { type: string, required: true }

# Measurement and estimand vocabulary required to author this fixture's claims.
quantity_kinds:
  abundance: { dimension: construct }
units:
  tpm: { symbol: TPM, quantity_kind: abundance }
transformations:
  identity: { kind: identity, fixed: true, domain: real, invertible: true }
measurements:
  gene: [abundance]
procedure_kinds:
  assay: { fills_within_model: false }
functionals:
  difference-of-means:
    form: contrast
    arity: two
    response_transformation: equivariant-affine
    reversal: negate
    response_reversal: negate
    exchange: not-applicable
    ties: not-applicable
    output: response-difference
    domain: real
    'null': zero
    increment: linear
    uncertainty: exact
    parameters: not-applicable
identification_classes:
  randomized: { licenses_layers: [causal, statistical] }
  experimental: { licenses_layers: [causal, statistical] }
designs:
  independent-groups: {}
selection_mechanisms:
  cohort-enrolment: {}
