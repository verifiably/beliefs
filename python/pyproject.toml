[project]
# The distribution name follows the stack-wide `verifiably-<layer>` scheme decided
# 2026-09-07; nothing here is published yet. `science` is the import name fixed by the
# domain-extension design §9.
name = "verifiably-beliefs"
version = "0.0.0"
description = "beliefs, the Science kernel: recording scientific belief and the evidence it rests on"
readme = "README.md"
license = "MIT"
authors = [{ name = "Keith Hughitt", email = "keith.hughitt@gmail.com" }]
requires-python = ">=3.11"
classifiers = ["Typing :: Typed"]
dependencies = [
  "verifiably-atoms",
  "verifiably-nodes",
  # Declared because `beliefs.corpus` names `pydantic.ValidationError` when it
  # wraps a document-validation refusal. It arrives with `verifiably-nodes` either
  # way; an undeclared import is a dependency nobody can see going stale.
  "pydantic>=2.0",
  "pyyaml>=6.0.3",
  "snakemake==8.11.4",
]

# The engine and the substrate are unpublished, so their source is overridden with
# the sibling checkouts. Publication removes these entries and adds released-version
# bounds above; nothing else about the dependency changes (adapter design §8).
[tool.uv.sources]
verifiably-atoms = { path = "../../atoms/python", editable = true }
verifiably-nodes = { path = "../../nodes/python", editable = true }

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefs"]

[tool.pytest.ini_options]
# The acceptance arms are excluded from the ordinary run rather than skipped
# inside it: they require the certified tuple and error without it, and an
# ordinary unit-test run must stay portable (adapter design §7).
addopts = "-q --ignore=tests/acceptance"
testpaths = ["tests"]
pythonpath = ["tools"]

[tool.ruff]
line-length = 120
force-exclude = true

# Freeze-protected files: byte-exact under a guard's pin, or cited-not-run evidence.
# tests/test_frozen_guards.py holds this list equal to frozen_guards.protected_paths;
# beliefs-ea5ec7 makes pins hold modulo formatting and removes it.
[tool.ruff.format]
exclude = [
    "tests/acceptance/n2_arms_cut10.py",
    "tests/acceptance/n2_arms_cut11.py",
    "tests/acceptance/n2_arms_cut12.py",
    "tests/acceptance/n2_arms_cut13.py",
