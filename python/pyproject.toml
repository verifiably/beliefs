[project]
# The published distribution name is not yet ruled; `nodes` is mid-rename into the
# `verifiably` namespace and nothing here is published. `science` is the import name
# fixed by the domain-extension design §9.
name = "beliefs"
version = "0.0.0"
description = "beliefs, the Science kernel: recording scientific belief and the evidence it rests on"
readme = "README.md"
license = "MIT"
authors = [{ name = "Keith Hughitt", email = "keith.hughitt@gmail.com" }]
requires-python = ">=3.11"
classifiers = ["Typing :: Typed"]
dependencies = [
  "atoms-core",
  "nodes-core",
  # Declared because `beliefs.corpus` names `pydantic.ValidationError` when it
  # wraps a document-validation refusal. It arrives with `nodes-core` either
  # way; an undeclared import is a dependency nobody can see going stale.
  "pydantic>=2.0",
  "pyyaml>=6.0.3",
  "snakemake==8.11.4",
]

# The engine and the substrate are unpublished, so their source is overridden with
# the sibling checkouts. Publication removes these entries and adds released-version
# bounds above; nothing else about the dependency changes (adapter design §8).
[tool.uv.sources]
atoms-core = { path = "../../atoms/python", editable = true }
nodes-core = { path = "../../nodes/python", editable = true }

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beliefs"]

[tool.pytest.ini_options]
# The acceptance arms are excluded from the ordinary run rather than skipped
# inside it: they require the certified tuple and error without it, and an
# ordinary unit-test run must stay portable (adapter design §7).
addopts = "-q --ignore=tests/acceptance"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
# Cut 5 is hash-pinned and cited, not run; its pre-permit call signatures are frozen.
exclude = ["tests/acceptance/test_n2_cut5.py"]
# tools/ is importable but not checked: tests/test_reproduction_driver.py imports the
# mm30 driver from there, and without this its every import is unresolvable. Adding
# tools to `include` instead would type-check it, which is beliefs-d84799's other half.
extraPaths = ["tools"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.7",
    "pyright>=1.1.390",
]
